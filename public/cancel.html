<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout canceled</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif; display: grid; place-items: center;
        min-height: 100vh; margin: 0; background: #0b0d12; color: #e7e9ee; text-align: center;
      }
      .card { background: #151922; border: 1px solid #262b36; border-radius: 16px; padding: 2.5rem; width: min(90vw, 380px); }
      a { color: #635bff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Checkout canceled</h1>
      <p style="color:#8b93a7">No charge was made. You can subscribe whenever you're ready.</p>
      <a href="/">Back home</a>
    </div>
  </body>
</html>
